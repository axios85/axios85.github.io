<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Server Switch Independent | Learning_Path</title>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #161b22;
            --accent-color: #00f0ff;
            --win-color: #79c0ff;
            --terminal-bg: #0d1117;
            --text-primary: #e6e6e6;
            --text-secondary: #8b949e;
            --placeholder-border: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        h1, h2, h3, .code-font, .lang-btn, pre {
            font-family: 'Fira Code', monospace;
        }

        header {
            padding: 0 5%;
            background: rgba(10, 11, 16, 0.98);
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 80px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .back-btn:hover { transform: translateX(-5px); }

        .lang-selector {
            position: fixed;
            top: 25px;
            right: 5%;
            z-index: 99999;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background-color: transparent;
            border: 1px solid #30363d;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        .lang-btn.active {
            background-color: rgba(0, 240, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .intro-box {
            border-left: 4px solid var(--win-color);
            padding-left: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .lab-section { margin-bottom: 3rem; }

        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        pre {
            background-color: var(--terminal-bg);
            border-radius: 6px;
            padding: 1.2rem;
            overflow-x: auto;
        }

        /* ✅ FIX IMÁGENES */
        .lab-img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        .screenshot-placeholder {
            border: 2px dashed var(--placeholder-border);
            background: #11141a;
            border-radius: 8px;
            padding: 2.5rem 1rem;
             margin: 1.5rem 0 2.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* ✅ OPTIMIZACIÓN MÓVIL */
        @media (max-width: 600px) {
            .screenshot-placeholder {
                padding: 1rem;
            }
            .lang-selector {
                right: 3%;
            }
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid #30363d;
            margin-top: 3rem;
        }
    </style>
</head>

<body>

<header>
    <a href="lab-redundancia.html" class="back-btn">< ./Volver</a>
</header>

<main class="container">

    <h1>Modo Switch Independent</h1>

    <div class="intro-box">
        <p>Configuración de agregación de enlaces en modo independiente.</p>
    </div>

    <section class="lab-section">
        <h2>Requisitos</h2>

        <div class="screenshot-placeholder">
            img/nodos-gns3.png
            <p>Topología GNS3</p>
        </div>
    </section>

    <section class="lab-section">
        <h2>Configuración</h2>

        <div class="screenshot-placeholder">
            img/win-nic-config.png
            <p>Configuración Windows</p>
        </div>
    </section>

    <section class="lab-section">
        <h2>Prueba</h2>

        <div class="screenshot-placeholder">
            img/win-nic-status.png
            <p>Estado adaptadores</p>
        </div>
    </section>

</main> <!-- ✅ CORREGIDO -->

<footer>
    <p>© 2025 fergava.es</p>
</footer>

</body>
</html>
